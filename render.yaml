# Nox backend — Render blueprint.
# STATUS: READY for online 1v1 (T12) — hosts the multiplayer WebSocket rooms.
# The static frontend stays on Vercel; this service is the authoritative WS server.
# REQUIRED secret: set WS_SECRET in the Render dashboard (long random string).
services:
  - type: web
    name: nox
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm --prefix ../frontend install && npm --prefix ../frontend run build
    startCommand: node --max-old-space-size=512 --optimize-for-size server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: WS_EXTRA_ORIGINS
        sync: false   # set to https://<your-vercel-domain> in the dashboard
