<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#c9ff2f"/>
    <stop offset="55%" stop-color="#58d8ff"/>
    <stop offset="100%" stop-color="#ff5ca8"/>
  </linearGradient>
  <linearGradient id="topScrim" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#07090b" stop-opacity="0.96"/>
    <stop offset="55%" stop-color="#07090b" stop-opacity="0.86"/>
    <stop offset="100%" stop-color="#07090b" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="botScrim" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#07090b" stop-opacity="0"/>
    <stop offset="40%" stop-color="#07090b" stop-opacity="0.88"/>
    <stop offset="100%" stop-color="#07090b" stop-opacity="1"/>
  </linearGradient>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
</defs>

<!-- top scrim for title -->
<rect x="0" y="0" width="1200" height="160" fill="url(#topScrim)"/>
<!-- bottom scrim -->
<rect x="0" y="470" width="1200" height="160" fill="url(#botScrim)"/>
<!-- subtle vignette -->
<rect x="0" y="0" width="1200" height="630" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

<!-- title lockup -->
<g transform="translate(600, 62)">
  <g transform="translate(-600, 0)">
    <rect x="24" y="18" width="32" height="1" fill="#c9ff2f" opacity="0.95"/>
    <text x="64" y="22" font-family="Courier New, monospace" font-size="10" letter-spacing="3.2" fill="#c9ff2f" font-weight="700">TWO PLAYERS. ONE VOID.</text>
    <g transform="translate(1080, 12)">
      <rect x="0" y="0" width="96" height="18" fill="rgba(88,216,255,0.09)" stroke="rgba(88,216,255,0.28)"/>
      <rect x="8" y="7" width="6" height="6" fill="#c9ff2f" transform="rotate(45 11 10)"/>
      <text x="20" y="12" font-family="Courier New, monospace" font-size="7" letter-spacing="1.2" fill="#58d8ff" font-weight="800">ONLINE // 60S</text>
    </g>
  </g>
  <text text-anchor="middle" font-family="Courier New, monospace" font-size="86" font-weight="800" letter-spacing="-6" fill="url(#titleGrad)" style="paint-order: stroke; stroke: rgba(255,255,255,0.10); stroke-width: 0.7px; filter: drop-shadow(0 2px 10px rgba(0,0,0,0.55));">NOX</text>
  <text x="88" y="-14" font-family="Courier New, monospace" font-size="11" letter-spacing="3.5" fill="rgba(241,244,243,0.78)" font-weight="700">//</text>
  <text text-anchor="middle" y="38" font-family="Courier New, monospace" font-size="30" font-weight="800" letter-spacing="9" fill="#f1f4f3" style="filter: drop-shadow(0 2px 10px rgba(0,0,0,0.68));">NEON VOID</text>
  <text text-anchor="middle" y="56" font-family="Courier New, monospace" font-size="9.5" letter-spacing="2.8" fill="rgba(241,244,243,0.74)">SAME KEYBOARD • FIRST TO 5 • 60S ROUNDS</text>
</g>

<!-- bottom meta bar - brighter for legibility over real screenshot -->
<g transform="translate(24, 590)">
  <g opacity="0.96">
    <rect width="14" height="14" fill="none" stroke="#c9ff2f" stroke-width="0.9" transform="rotate(45 7 7)"/>
    <rect x="4.2" y="4.2" width="5.6" height="5.6" fill="#c9ff2f"/>
  </g>
  <text x="22" y="11" font-family="Courier New, monospace" font-size="10" letter-spacing="2.6" fill="#f1f4f3" font-weight="700">NOX</text>
  <text x="52" y="11" font-family="Courier New, monospace" font-size="9" letter-spacing="1.2" fill="rgba(241,244,243,0.78)">// NEON VOID</text>
  <text x="600" y="11" text-anchor="middle" font-family="Courier New, monospace" font-size="8.5" letter-spacing="1.6" fill="rgba(241,244,243,0.82)">BUILT WITH SVG • NO CANVAS • 60FPS</text>
  <text x="1176" y="11" text-anchor="end" font-family="Courier New, monospace" font-size="8" letter-spacing="1.4" fill="rgba(241,244,243,0.68)">34° 12' 08&#34; N  118° 14' 37&#34; W</text>
</g>

<!-- top lime hairline -->
<rect x="0" y="0" width="1200" height="1.6" fill="#c9ff2f" opacity="0.96"/>
<!-- bottom hairline subtle -->
<rect x="0" y="629" width="1200" height="1" fill="rgba(255,255,255,0.06)"/>
</svg>